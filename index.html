<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Mock Test</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <div id="auth-section" class="container">
        <h2>Mock Test Platform</h2>
        <div id="login-box">
            <input type="email" id="log-email" placeholder="Email">
            <input type="password" id="log-pass" placeholder="Password">
            <button onclick="login()">Login</button>
            <p onclick="toggleAuth()" class="link">New? Register Here</p>
        </div>
        <div id="reg-box" style="display:none;">
            <input type="text" id="reg-name" placeholder="Full Name">
            <input type="number" id="reg-mobile" placeholder="Mobile Number">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-pass" placeholder="Password">
            <button onclick="register()">Register</button>
            <p onclick="toggleAuth()" class="link">Have an account? Login</p>
        </div>
        <p id="auth-msg"></p>
    </div>

    <div id="dashboard-section" class="container hidden">
        <h2>Welcome, <span id="user-name"></span></h2>
        <p>Status: <span id="pay-status" class="badge"></span></p>
        <p>Attempts Left: <span id="attempts-left"></span></p>
        
        <div id="payment-box" class="hidden">
            <p>Unlock Premium Tests Now!</p>
            <button onclick="payWithRazorpay()" class="pay-btn">Pay ₹99 to Unlock</button>
        </div>

        <div id="test-start-box" class="hidden">
            <button onclick="startTest()" class="start-btn">Start Mock Test</button>
        </div>
        <button onclick="logout()" class="logout-btn">Logout</button>
    </div>

    <div id="test-section" class="container hidden">
        <div class="test-header">
            <h3>Question <span id="q-num">1</span> of <span id="total-q"></span></h3>
            <h3 class="timer" id="timer">10:00</h3>
        </div>
        <div class="question-box">
            <p id="q-text">Loading question...</p>
            <div class="options" id="options-container"></div>
        </div>
        <button onclick="nextQuestion()" id="next-btn" disabled>Next Question</button>
    </div>

    <div id="result-section" class="container hidden">
        <h2>Test Submitted!</h2>
        <div class="score-card">
            <h3>Score: <span id="res-score"></span> / <span id="res-total"></span></h3>
            <h3>Percentage: <span id="res-percent"></span>%</h3>
        </div>
        <button onclick="goHome()">Back to Dashboard</button>
        <div id="review-box"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
